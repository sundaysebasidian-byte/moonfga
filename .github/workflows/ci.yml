name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-test:
    name: check / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Toolchain version
        run: moon version

      - name: Check (native)
        run: moon check --deny-warn --target native

      - name: Check (wasm-gc)
        run: moon check --deny-warn --target wasm-gc

      - name: Build
        run: moon build

      - name: Test
        run: moon test --target native

      - name: Format check
        run: moon fmt --check

      - name: Public interface is up to date
        shell: bash
        run: |
          moon info
          git diff --exit-code -- "*.mbti"

  extra-targets:
    name: test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, js]
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check ${{ matrix.target }}
        run: moon check --deny-warn --target ${{ matrix.target }}

      - name: Test ${{ matrix.target }}
        run: moon test --target ${{ matrix.target }}

  web:
    name: web playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build playground
        run: scripts/build-web.sh

      - name: Smoke test
        run: node web/smoke.mjs

  readme-quickstart:
    name: README quick start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Library example
        run: moon run examples/library

      - name: Validate and transform
        run: |
          moon run cmd/main -- validate examples/basic/model.fga
          moon run cmd/main -- transform examples/basic/model.fga --to json > /dev/null
          moon run cmd/main -- transform examples/basic/model.fga --to dsl > /dev/null

      - name: Check, list and expand
        run: |
          moon run cmd/main -- check \
            --model examples/basic/model.fga \
            --store examples/basic/tuples.fga \
            --object document:budget --relation viewer --user user:bob --explain
          moon run cmd/main -- list-objects \
            --model examples/basic/model.fga --store examples/basic/tuples.fga \
            --type document --relation viewer --user user:bob
          moon run cmd/main -- list-users \
            --model examples/basic/model.fga --store examples/basic/tuples.fga \
            --object document:budget --relation viewer --filters user
          moon run cmd/main -- expand \
            --model examples/basic/model.fga --store examples/basic/tuples.fga \
            --object document:budget --relation viewer > /dev/null

      - name: ABAC condition
        run: |
          moon run cmd/main -- check \
            --model examples/abac/model.fga --store examples/abac/tuples.fga \
            --object document:plan --relation viewer --user user:dana \
            --context '{"office":"hq","allowed":["remote"]}'

      - name: Store test suites
        run: |
          moon run cmd/main -- test examples/basic/store.fga.yaml
          moon run cmd/main -- test examples/abac/store.fga.yaml

  conformance:
    name: upstream conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned upstream data
        run: scripts/fetch-upstream.sh

      - name: OpenFGA Check / ListObjects / ListUsers matrix
        run: ./scripts/conformance.sh

      - name: openfga/language DSL <-> JSON fixtures
        run: moon run cmd/language

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: conformance-results/
          if-no-files-found: warn
