<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoonFGA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M21 4a12 12 0 1 0 7 21A10 10 0 0 1 21 4z' fill='%234a5fd8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script>
  (function () {
    var saved = localStorage.getItem("theme");
    if (saved) document.documentElement.dataset.theme = saved;
  })();
</script>
</head>
<body>
<header class="top">
  <div class="brand">MoonFGA</div>
  <nav class="seg" id="examples" aria-label="Examples"></nav>
  <button class="icon-btn" id="theme" type="button" aria-label="Theme">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
  </button>
</header>

<main class="layout">
  <section class="column">
    <div class="card grow-3" id="model-card">
      <div class="card-head">
        <h2>Model</h2>
        <div class="seg small" id="format">
          <button type="button" data-format="dsl">DSL</button>
          <button type="button" data-format="json">JSON</button>
        </div>
      </div>
      <div class="editor" id="model-editor"></div>
      <ul class="issues" id="issues" hidden></ul>
    </div>
    <div class="card grow-2" id="tuples-card">
      <div class="card-head"><h2>Tuples</h2></div>
      <div class="editor" id="tuples-editor"></div>
    </div>
  </section>

  <section class="column">
    <div class="card fill">
      <div class="tabs" role="tablist" id="tabs">
        <button type="button" role="tab" data-tab="check">Check</button>
        <button type="button" role="tab" data-tab="objects">List objects</button>
        <button type="button" role="tab" data-tab="users">List users</button>
        <button type="button" role="tab" data-tab="tests">Tests</button>
      </div>

      <div class="panel" id="panel-check" role="tabpanel">
        <div class="form three">
          <label>User<input id="check-user" spellcheck="false" autocomplete="off" list="dl-users"></label>
          <label>Relation<input id="check-relation" spellcheck="false" autocomplete="off" list="dl-relations"></label>
          <label>Object<input id="check-object" spellcheck="false" autocomplete="off" list="dl-objects"></label>
        </div>
        <label class="ctx">Context<input id="check-context" spellcheck="false" autocomplete="off"></label>
        <div class="result" id="result-check"></div>
      </div>

      <div class="panel" id="panel-objects" role="tabpanel" hidden>
        <div class="form three">
          <label>User<input id="objects-user" spellcheck="false" autocomplete="off" list="dl-users"></label>
          <label>Relation<input id="objects-relation" spellcheck="false" autocomplete="off" list="dl-relations"></label>
          <label>Type<input id="objects-type" spellcheck="false" autocomplete="off" list="dl-types"></label>
        </div>
        <label class="ctx">Context<input id="objects-context" spellcheck="false" autocomplete="off"></label>
        <div class="result" id="result-objects"></div>
      </div>

      <div class="panel" id="panel-users" role="tabpanel" hidden>
        <div class="form three">
          <label>Object<input id="users-object" spellcheck="false" autocomplete="off" list="dl-objects"></label>
          <label>Relation<input id="users-relation" spellcheck="false" autocomplete="off" list="dl-relations"></label>
          <label>Filter<input id="users-filters" spellcheck="false" autocomplete="off" list="dl-types"></label>
        </div>
        <label class="ctx">Context<input id="users-context" spellcheck="false" autocomplete="off"></label>
        <div class="result" id="result-users"></div>
      </div>

      <div class="panel panel-tests" id="panel-tests" role="tabpanel" hidden>
        <div class="editor" id="tests-editor"></div>
        <div class="tests-bar">
          <button type="button" class="primary" id="run-tests">Run</button>
          <div class="result" id="result-tests"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<datalist id="dl-users"></datalist>
<datalist id="dl-relations"></datalist>
<datalist id="dl-objects"></datalist>
<datalist id="dl-types"></datalist>

<script type="module" src="app.js"></script>
</body>
</html>
